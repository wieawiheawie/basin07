[build]
jobs = 2
incremental = true

[alias]
check-web = "check --profile wasm-dev --target wasm32-unknown-unknown --no-default-features --features client,webgl2 --bin basin07"
test-core = "test --no-default-features --lib"
validate-core = "run --no-default-features --bin basin-validator -- --seeds 256"
run-desktop = "run --no-default-features --features client,desktop --bin basin07"

[target.wasm32-unknown-unknown]
# Rust's wasm32-unknown-unknown target uses rust-lld (wasm-ld) by default.
# Do not override it with the host linker. Avoid emitting unnecessary DWARF.
rustflags = ["-C", "strip=debuginfo"]
