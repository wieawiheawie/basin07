name: BASIN 07 CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basin07-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm concurrency stanza
        run: echo "Workflow with concurrency started."
