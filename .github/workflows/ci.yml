name: Deskbound checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim -> sim/target
      - name: Rust tests
        run: cargo test --manifest-path sim/Cargo.toml
      - name: Rust clippy
        run: cargo clippy --manifest-path sim/Cargo.toml --all-targets -- -D warnings
      - name: TypeScript typecheck
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
