name: BASIN 07 CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basin07-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-check:
    name: Content, Rust tests and WASM check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install stable Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Validate content and economy
        run: python scripts/validate_content.py --stage all --seeds 256

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust simulation tests
        run: cargo test --no-default-features --lib

      - name: Run Rust headless validator
        run: cargo run --no-default-features --bin basin-validator -- --seeds 256

      - name: Check WebAssembly client
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features client,webgl2 --bin basin07
