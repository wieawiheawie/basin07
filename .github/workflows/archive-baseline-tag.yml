name: Create preserved BASIN 07 tag

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-baseline-tag.yml"

permissions:
  contents: write

jobs:
  preserve-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Tag the exact pre-workflow main commit
        uses: actions/github-script@v7
        with:
          script: |
            const target = context.payload.before;
            if (!/^[0-9a-f]{40}$/.test(target)) {
              throw new Error(`Unexpected pre-push commit: ${target}`);
            }

            const ref = "tags/basin07-final";
            try {
              const existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
              });
              if (existing.data.object.sha !== target) {
                throw new Error(
                  `basin07-final already points to ${existing.data.object.sha}, expected ${target}`
                );
              }
              core.info(`basin07-final already points to ${target}`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "refs/tags/basin07-final",
                sha: target,
              });
              core.info(`Created basin07-final at ${target}`);
            }
