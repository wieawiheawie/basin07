[package]
name = "basin07"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A real-time 3D geothermal DLE factory simulation for the browser"
license = "MIT"

[lib]
name = "basin07_core"
crate-type = ["rlib"]

[[bin]]
name = "basin07"
path = "src/main.rs"
required-features = ["client"]

[[bin]]
name = "basin-validator"
path = "src/bin/validator.rs"

[features]
default = ["client", "webgl2"]
client = ["dep:bevy"]
webgl2 = ["client", "bevy/webgl2"]
webgpu = ["client", "bevy/webgpu"]
desktop = ["client", "bevy/x11", "bevy/wayland"]

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["async_executor", "bevy_asset", "bevy_camera", "bevy_color", "bevy_core_pipeline", "bevy_image", "bevy_light", "bevy_log", "bevy_material", "bevy_mesh", "bevy_pbr", "bevy_render", "bevy_shader", "bevy_text", "bevy_ui", "bevy_ui_render", "bevy_window", "bevy_winit", "default_font", "std"], optional = true }
rhai = { version = "1.27.0", default-features = false, features = ["std", "sync", "no_module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "HtmlTextAreaElement"] }

[profile.release]
opt-level = "s"
lto = false
codegen-units = 16
panic = "abort"
strip = true
debug = false

[profile.dist]
inherits = "release"
lto = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 0

# Fast WebAssembly iteration. Compile the game crate lightly, but optimize
# external dependencies once so application edits do not recompile them.
[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = false
incremental = true
codegen-units = 256

[profile.wasm-dev.package."*"]
opt-level = 3

